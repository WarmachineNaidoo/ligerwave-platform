services:
  api:
    build: platform
    ports: ["8000:8000"]
    env_file: platform/.env
    environment:
      - ENVIRONMENT=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  retention:
    build: platform
    env_file: platform/.env
    command: python -c "import time; from app.services.retention import purge_all; [purge_all() or time.sleep(86400) for _ in iter(int,1)]"
    restart: unless-stopped

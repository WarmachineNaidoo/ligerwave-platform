name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        working-directory: /home/ubuntu/ligerwave-platform
        run: |
          git reset --hard origin/master
          git pull origin master
          # Free up disk space before deploy
          docker system prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          df -h / | tail -1
          # Remove old containers
          docker rm -f ligerwave-api ligerwave-nginx 2>/dev/null || true
          # Build and deploy
          cd platform
          docker compose build api 2>&1
          docker compose up -d 2>&1
          # Verify deploy
          sleep 5
          curl -sf http://localhost:8000/health || { echo "DEPLOY FAILED"; exit 1; }
          echo "DEPLOY SUCCESS"
          docker system prune -f 2>/dev/null || true

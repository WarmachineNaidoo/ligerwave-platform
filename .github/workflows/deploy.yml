name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        working-directory: /home/ubuntu/ligerwave-platform
        run: |
          git reset --hard origin/master
          git pull origin master
          cp platform/app/static/dashboard.html platform/app/static/index.html
          docker rm -f ligerwave-api ligerwave-nginx 2>/dev/null || true
          cd platform
          docker compose build api
          docker compose up -d
          docker system prune -f

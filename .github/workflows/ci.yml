name: CSI Platform CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r platform/requirements.txt
      - run: python -c "import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('platform/**/*.py', recursive=True)]"
      - run: python -c "import sys; sys.path.insert(0,'platform'); from app.database import supabase, service; print('Imports OK')"

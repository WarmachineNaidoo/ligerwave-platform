name: CI
on:
  push:
    branches: [master, main]
    paths:
      - 'platform/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'platform/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app/ || true
      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and tag Docker image
        run: |
          docker compose build api
          docker tag ligerwave-api:latest ghcr.io/${{ github.repository }}/ligerwave-api:latest
          docker tag ligerwave-api:latest ghcr.io/${{ github.repository }}/ligerwave-api:sha-${{ github.sha }}
      - name: Push to ghcr.io
        run: |
          docker push ghcr.io/${{ github.repository }}/ligerwave-api:latest
          docker push ghcr.io/${{ github.repository }}/ligerwave-api:sha-${{ github.sha }}

  security-scan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
          if command -v ruff &>/dev/null; then pip install ruff; fi
      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app/ || echo "Ruff found issues (non-blocking)"
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'http://localhost' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'test' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || 'test' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'test' }}

  build:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and tag Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7} \
                       -f Dockerfile .
      - name: Push to ghcr.io
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}
      - name: Smoke test — start container
        run: |
          docker run -d --name smoke-test -p 8000:8000 \
            -e SUPABASE_URL=http://localhost \
            -e SUPABASE_KEY=test \
            -e SUPABASE_SERVICE_KEY=test \
            -e SUPABASE_JWT_SECRET=test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 3
      - name: Smoke test — /health
        run: |
          curl -sf http://localhost:8000/health || { echo "Health check failed"; exit 1; }
      - name: Smoke test — /api/v1/info
        continue-on-error: true
        run: |
          curl -sf http://localhost:8000/api/v1/info || echo "Info endpoint not available (non-fatal)"
      - name: Cleanup
        if: always()
        run: docker rm -f smoke-test 2>/dev/null || true

  security-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --desc on || echo "pip-audit found vulnerabilities (non-blocking)"
      - name: Trivy scan (dry-run)
        continue-on-error: true
        run: |
          if command -v trivy &>/dev/null; then
            docker build -t scan-target -f Dockerfile .
            trivy image --severity HIGH,CRITICAL --exit-code 0 scan-target
          else
            echo "trivy not available — skipping (non-blocking)"
          fi

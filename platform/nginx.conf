worker_processes auto;
events { worker_connections 1024; }

http {
  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=export:10m rate=5r/m;

  # Proxy buffer settings for CSI packets
  proxy_buffer_size 64k;
  proxy_buffers 4 64k;
  proxy_busy_buffers_size 64k;

  upstream api {
    server api:8000;
    keepalive 64;
  }

  server {
    listen 80;
    server_name ligerwave.tech;

    client_max_body_size 10M;

    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location /auth/ {
      limit_req zone=login burst=3 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
      limit_req zone=ws burst=5;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /export/ {
      limit_req zone=export burst=2;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /static/ {
      proxy_pass http://api;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }
  }
}

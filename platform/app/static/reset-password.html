<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - CSI Security</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#e2e8f0;height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1e293b;padding:32px;border-radius:12px;width:360px;max-width:90vw}
h2{margin-bottom:20px;font-size:20px;text-align:center}
p{color:#94a3b8;font-size:13px;margin-bottom:16px;text-align:center}
.input-wrap{position:relative;margin-bottom:14px}
.input-wrap input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;outline:0}
.input-wrap input:focus{border-color:#3b82f6}
.toggle-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#64748b;cursor:pointer;padding:4px;font-size:16px;line-height:1}
.toggle-eye:hover{color:#94a3b8}
.btn{width:100%;padding:10px;border-radius:8px;border:0;font-weight:600;cursor:pointer;font-size:14px;background:#3b82f6;color:#fff;transition:all .15s}
.btn:hover{background:#2563eb}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.error{color:#ef4444;font-size:12px;text-align:center;margin-top:10px}
.success{color:#22c55e;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h2>Set New Password</h2>
  <p id="status-text">Enter your new password below.</p>
  <div class="input-wrap">
    <input type="password" id="password" placeholder="New password (min 6 chars)" autocomplete="new-password">
    <button class="toggle-eye" onclick="toggleEye()" aria-label="Toggle password visibility">&#x1f441;</button>
  </div>
  <button class="btn" id="reset-btn" onclick="resetPassword()">Update Password</button>
  <div id="msg" class="error"></div>
</div>

<script>
var supabase = createClient('SUPABASE_URL_PLACEHOLDER', 'SUPABASE_KEY_PLACEHOLDER');
var accessToken = null;

(function() {
  var hash = window.location.hash;
  var params = new URLSearchParams(hash.replace('#', '?'));
  accessToken = params.get('access_token');
  var type = params.get('type');
  if (!accessToken || type !== 'recovery') {
    document.getElementById('status-text').textContent = 'Invalid or expired reset link.';
    document.getElementById('reset-btn').disabled = true;
  }
})();

function toggleEye() {
  var inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function resetPassword() {
  var pw = document.getElementById('password').value;
  if (pw.length < 6) { document.getElementById('msg').textContent = 'Password must be at least 6 characters'; return; }
  document.getElementById('msg').textContent = '';
  document.getElementById('reset-btn').disabled = true;
  document.getElementById('reset-btn').textContent = 'Updating...';

  try {
    await supabase.auth.setSession({ access_token: accessToken, refresh_token: '' });
    var { error } = await supabase.auth.updateUser({ password: pw });
    if (error) throw error;
    document.getElementById('msg').className = 'success';
    document.getElementById('msg').textContent = 'Password updated! Redirecting...';
    setTimeout(function() { window.location.href = '/'; }, 2000);
  } catch (e) {
    document.getElementById('msg').textContent = 'Failed: ' + e.message;
    document.getElementById('reset-btn').disabled = false;
    document.getElementById('reset-btn').textContent = 'Update Password';
  }
}
</script>
</body>
</html>
